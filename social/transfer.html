<!doctype html><meta charset="utf-8"><title>bc transfer</title><body style="font:16px sans-serif;background:#2340d6;color:#fff">
<p id="s">Preparando vídeo…</p>
<script>
(async()=>{const s=document.getElementById('s');
try{const r=await fetch('reel-01-cyberleek.mp4');const buf=await r.arrayBuffer();
s.textContent='Descargado '+buf.byteLength+' bytes';
if(!window.opener){s.textContent+=' · sin opener';return;}
window.opener.postMessage({bcreel:buf},'https://www.instagram.com');
s.textContent+=' · enviado';setTimeout(()=>window.close(),1500);
}catch(e){s.textContent='Error '+e.message}})();
</script>
