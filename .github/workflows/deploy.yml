name: Publicar en Cloudflare Pages

on:
  push:
    branches: [main]
  schedule:
    # Reconstruye cada 6 horas para que aparezcan los artículos programados
    # y el sitemap de Google News se mantenga al día.
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: public/img/fotos
          key: fotos-${{ hashFiles('src/content/articulos/*.md') }}
          restore-keys: fotos-
      - name: Descargar fotos reales (Wikimedia Commons)
        run: pip install --quiet pillow && python3 tools/foto.py ci
      - run: npm run build
      - name: Subir a Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 8e6d31743e402a40e739874a3c436067
          command: pages deploy dist --project-name=brechacero --branch=main --commit-dirty=true
      - name: Avisar a Bing/IndexNow de las noticias nuevas
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          sleep 20
          URLS=$(python3 -c "import re;x=open('dist/news-sitemap.xml').read();print(','.join('\"'+u+'\"' for u in re.findall(r'<loc>([^<]+)</loc>',x)+['https://brechacero.pages.dev/']))")
          curl -s -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"brechacero.pages.dev\",\"key\":\"878941f683a757a78687d2d4dd334f43\",\"keyLocation\":\"https://brechacero.pages.dev/878941f683a757a78687d2d4dd334f43.txt\",\"urlList\":[$URLS]}" -w "IndexNow HTTP %{http_code}\n"
